name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

      NODE_ENV: ${{ secrets.NODE_ENV }}
      PORT: ${{ secrets.PORT }}

      DLQ_ALERT_THRESHOLD: ${{ secrets.DLQ_ALERT_THRESHOLD }}
      STARVATION_THRESHOLD_MS: ${{ secrets.STARVATION_THRESHOLD_MS }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $SERVER_PORT $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connectivity
        run: |
          ssh -v -p $SERVER_PORT \
            -o StrictHostKeyChecking=accept-new \
            $SERVER_USER@$SERVER_IP \
            "echo SSH connection successful"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          script_stop: true
          envs: DATABASE_URL,REDIS_URL,NODE_ENV,PORT,DLQ_ALERT_THRESHOLD,STARVATION_THRESHOLD_MS,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,ALERT_EMAIL_TO
          script: |
            set -e

            APP_DIR="/var/www/scheduler-api"

            mkdir -p $APP_DIR
            cd $APP_DIR

            # Clone repo if first deploy
            if [ ! -d .git ]; then
              git clone https://github.com/amiabl-programr/stage-9-background-job-scheduler-be.git .
            fi

            # Update code
            git fetch origin main
            git reset --hard origin/main

            # =========================
            # ENV FILE (echo method)
            # =========================
            echo "NODE_ENV=$NODE_ENV" > .env
            echo "PORT=$PORT" >> .env

            echo "DATABASE_URL=$DATABASE_URL" >> .env
            echo "REDIS_URL=$REDIS_URL" >> .env

            echo "DLQ_ALERT_THRESHOLD=$DLQ_ALERT_THRESHOLD" >> .env
            echo "STARVATION_THRESHOLD_MS=$STARVATION_THRESHOLD_MS" >> .env

            echo "SMTP_HOST=$SMTP_HOST" >> .env
            echo "SMTP_PORT=$SMTP_PORT" >> .env
            echo "SMTP_USER=$SMTP_USER" >> .env
            echo "SMTP_PASS=$SMTP_PASS" >> .env
            echo "ALERT_EMAIL_TO=$ALERT_EMAIL_TO" >> .env
            echo "APP_URL=$APP_URL" >> .env

            # Install dependencies
            pnpm install --frozen-lockfile

            # Build
            pnpm build

            # Run migrations
            pnpm migration:run

            # PM2 - API
            if pm2 describe scheduler-api > /dev/null 2>&1; then
              pm2 restart scheduler-api --update-env
            else
              pm2 start dist/main.js --name scheduler-api
            fi

            # PM2 - Worker
            if pm2 describe scheduler-worker > /dev/null 2>&1; then
              pm2 restart scheduler-worker --update-env
            else
              pm2 start dist/worker.js --name scheduler-worker
            fi

            pm2 save

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused \
            http://$APP_DOMAIN/api/health

      - name: Write deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ success" >> $GITHUB_STEP_SUMMARY
